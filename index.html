<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Knowledge Portal</title>
    <style>
        :root {
            --background-color: #1a1a1a;
            --text-color: #e0e0e0;
            --primary-color: #4CAF50;
            --secondary-color: #333;
            --border-color: #555;
            --hover-color: #5cb85c;
            --error-color: #f44336;
            --success-color: #4CAF50;
            --card-background: #2a2a2a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --background-color: #f4f4f4;
                --text-color: #333;
                --primary-color: #4CAF50;
                --secondary-color: #ccc;
                --border-color: #bbb;
                --hover-color: #5cb85c;
                --error-color: #f44336;
                --success-color: #4CAF50;
                --card-background: #ffffff;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        section {
            background-color: var(--card-background);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 25px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        #login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        input[type="text"],
        textarea,
        select {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--hover-color);
        }

        #app-section {
            display: none; /* Hidden by default */
            width: 100%;
            max-width: 800px;
        }

        #current-user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: var(--secondary-color);
            border-radius: 4px;
        }

        #current-user {
            font-weight: bold;
            color: var(--primary-color);
        }

        #content-list {
            list-style: none;
            padding: 0;
        }

        .content-item {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .content-item h3 {
            margin: 0;
            color: var(--primary-color);
        }

        .content-item p {
            margin: 0;
            font-size: 0.9em;
        }

        .content-item .actions button {
            margin-right: 8px;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        #content-form-section {
            display: none; /* Hidden by default for employees */
        }

        #content-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        #error-message {
            color: var(--error-color);
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            section {
                padding: 15px;
            }
            .content-item .actions button {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Employee Knowledge Portal</h1>
    </header>

    <section id="login-section">
        <h2>Login</h2>
        <input type="text" id="username-input" placeholder="Enter your username">
        <button id="login-button">Login / Register</button>
        <div id="error-message"></div>
    </section>

    <section id="app-section">
        <div id="current-user-info">
            <span>Logged in as: <span id="current-user"></span></span>
            <button id="logout-button">Logout</button>
        </div>

        <section id="content-form-section">
            <h2>Manage Content</h2>
            <form id="content-form">
                <label for="content-title">Title:</label>
                <input type="text" id="content-title" required>

                <label for="content-type">Type:</label>
                <select id="content-type">
                    <option value="Course">Course</option>
                    <option value="Policy">Policy</option>
                    <option value="Article">Article</option>
                </select>

                <label for="content-text">Content (supports Markdown, embedded media URLs):</label>
                <textarea id="content-text" rows="10" required></textarea>

                <button type="submit" id="content-submit">Create Content</button>
            </form>
        </section>

        <section>
            <h2>Knowledge Base</h2>
            <ul id="content-list"></ul>
        </section>
    </section>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>
